name: broomm
description: A controller-first RomM game library and launcher.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: 1.6.3
  # 2.3.x introduces JNI native assets into desktop bundles, requiring a JVM.
  # Keep the compatible channel-based Android implementation for this preview.
  path_provider_android: 2.2.23
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/setup/
    - assets/setup/linux-x64/
    - assets/setup/linux-arm64/
    - assets/branding/MATERIAL-ICONS-LICENSE.txt
    - assets/branding/broomm-icon.png
    - assets/steam/
